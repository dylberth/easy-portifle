<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <title>Login do Administrador</title>
</head>

<body>
  <div class="page-shell">
    <header class="page-header">
      <div class="brand">
        <img src="guega_n.png" alt="Logo Guega Esportes" class="brand-logo">
        <div class="brand-text">
          <p class="eyebrow">ADMIN</p>
          <h1 class="titulo">Login do Administrador</h1>
        </div>
      </div>
      <nav class="admin-nav">
        <a href="index.html">Voltar ao site</a>
      </nav>
    </header>

    <main>
      <section class="cadastro-card admin-card">
        <h2>Entrar como administrador</h2>
        <p>Digite a senha para acessar a área administrativa.</p>
        <form id="login-form">
          <input id="admin-password" type="password" placeholder="Senha do administrador">
          <button type="submit">Entrar</button>
          <p id="login-error" class="login-error"></p>
        </form>
      </section>
    </main>
  </div>

  <footer>
    <ul>
      <li><a href="https://www.instagram.com/_guegaesportes/">Instagram</a></li>
      <li><a href="https://wa.me/5511983155581">Contato</a></li>
    </ul>
  </footer>

  <script src="admin-login.js"></script>
</body>

</html>
